services:
  mysql:
    image: mysql:8.4
    container_name: inventory-service-mysql
    restart: unless-stopped
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-inventory_service}
      MYSQL_USER:          ${MYSQL_USER:-inventory_service}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD:-inventory_service_pw}
      TZ: UTC
    volumes:
      - inventory_service_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpw}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  adminer:
    image: adminer:5
    container_name: inventory-service-adminer
    restart: unless-stopped
    ports:
      - "8092:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: dracula
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  inventory_service_mysql_data:
    name: inventory_service_mysql_data