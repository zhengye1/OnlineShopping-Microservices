spring:
  application:
    name: product-service

  # ===== DataSource (MySQL via local Docker — see services/user-service/docker-compose.yml) =====
  datasource:
    url: jdbc:mysql://localhost:3308/product_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:product_service}
    password: ${DB_PASSWORD:product_service_pw}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      max-lifetime: 1800000

  # ===== JPA / Hibernate =====
  jpa:
    hibernate:
      ddl-auto: validate            # Flyway 控制 schema；JPA 只 validate entity ↔ table mapping
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        # Anti-N+1 default：fetch 一定要 explicit
        default_batch_fetch_size: 16
    show-sql: false                 # 開發 debug 可 toggle on
    open-in-view: false             # ⭐ 禁用 OSIV — production grade，強迫 explicit transaction boundary

  # ===== Flyway migration =====
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # ===== Kafka producer (L6 cross-service event publish) =====
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all                                  # 等所有 in-sync replica ack — max durability
      retries: 3                                 # 失敗 auto retry 3 次 (network glitch tolerant)
      properties:
        enable.idempotence: true                 # producer 內部 sequence-number dedup (broker-side)
        max.in.flight.requests.per.connection: 5 # idempotence 要求 ≤ 5
        delivery.timeout.ms: 10000               # 整個 send 操作 timeout
        request.timeout.ms: 5000                 # 單次 broker request timeout


# ===== Server =====
server:
  port: 8082                        # monolith 用 8080；product-service 8082
  error: # ← 新加
    include-message: always           # ← 新加
    include-binding-errors: always    # ← 新加

# ===== Application-specific config =====

# ===== Logging =====
logging:
  level:
    com.onlineshopping: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

app:
  snowflake:
    datacenter-id: 1    # L5: hardcode 1 for product-service
    worker-id: 1        # L5: hardcode 1 (single instance)
  kafka:
    topic:
      product-events: product-events   # L6 cross-service event topic