spring:
  application:
    name: cart-service

  # ===== DataSource (MySQL via docker-compose, port 3310) =====
  datasource:
    url: jdbc:mysql://localhost:3310/cart_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:cart_service}
    password: ${DB_PASSWORD:cart_service_pw}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      max-lifetime: 1800000

  # ===== JPA / Hibernate =====
  jpa:
    hibernate:
      ddl-auto: validate            # Flyway 控制 schema，JPA validate only
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 16
    show-sql: false
    open-in-view: false             # 禁 OSIV — production-grade

  # ===== Flyway migration =====
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # ===== Security (JWT resource server — mirror Phase 2 pattern) =====
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

  # ===== Error response: RFC 7807 ProblemDetail =====
  # Emit { type, title, status, detail, instance } for ResponseStatusException
  # (matches Stripe / GitHub API convention; replaces Spring Boot default
  # /error forward whose body MockMvc cannot follow).
  mvc:
    problemdetails:
      enabled: true

  output:
    ansi:
      enabled: always

# ===== Server =====
server:
  port: 8084                        # user 8081, product 8082, inventory 8083, cart 8084
  error:
    include-message: always
    include-binding-errors: always

# ===== Logging =====
logging:
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr([%X{correlationId:-no-cid}]){magenta} %clr(%-5level)
  %clr(%logger{36}){cyan} - %msg%n"
  level:
    com.onlineshopping: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

# ===== Application-specific config (Feign client base URLs) =====
app:
  product-service:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
  inventory-service:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8083}
