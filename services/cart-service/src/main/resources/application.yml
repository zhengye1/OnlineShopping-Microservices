spring:
  application:
    name: cart-service

  # ===== DataSource (MySQL via docker-compose, port 3310) =====
  datasource:
    url: jdbc:mysql://localhost:3310/cart_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:cart_service}
    password: ${DB_PASSWORD:cart_service_pw}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      max-lifetime: 1800000

  # ===== JPA / Hibernate =====
  jpa:
    hibernate:
      ddl-auto: validate            # Flyway 控制 schema，JPA validate only
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 16
    show-sql: false
    open-in-view: false             # 禁 OSIV — production-grade

  # ===== Flyway migration =====
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # ===== Security (JWT resource server — mirror Phase 2 pattern) =====
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

  # ===== Error response: RFC 7807 ProblemDetail =====
  # Emit { type, title, status, detail, instance } for ResponseStatusException
  # (matches Stripe / GitHub API convention; replaces Spring Boot default
  # /error forward whose body MockMvc cannot follow).
  mvc:
    problemdetails:
      enabled: true

  output:
    ansi:
      enabled: always

# ===== Server =====
server:
  port: 8084                        # user 8081, product 8082, inventory 8083, cart 8084
  error:
    include-message: always
    include-binding-errors: always

# ===== Logging =====
logging:
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr([%X{correlationId:-no-cid}]){magenta} %clr(%-5level)
  %clr(%logger{36}){cyan} - %msg%n"
  level:
    com.onlineshopping: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

# ===== Application-specific config (Feign client base URLs) =====
app:
  product-service:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
  inventory-service:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8083}

# ===== Resilience4j (L8 / L9) =====
# Each downstream gets its own CB instance so failures isolate per service.
# Inventory dying should not trip product's CB and vice versa.
resilience4j:
  circuitbreaker:
    instances:
      productClient:
        # Sliding window of last 10 calls — small enough for fast trip in tests
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        # Don't trip until we have 5 data points — avoid 1-fail-trips noise
        minimum-number-of-calls: 5
        # > 50% failure rate flips CLOSED → OPEN
        failure-rate-threshold: 50
        # Calls slower than 2s count as "slow" for slow-call-rate trip
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 50
        # OPEN state lockout — drop traffic 30s before probing again
        wait-duration-in-open-state: 30s
        # HALF_OPEN: let 3 probe calls through to test recovery
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # Trip on these exceptions (Feign throws FeignException + subclasses)
        record-exceptions:
          - feign.FeignException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        # Don't count these as failures (404 = downstream alive, just no record)
        ignore-exceptions:
          - feign.FeignException$NotFound
      # L9 warm-up — L8 hw Q1 落地. Same threshold knobs as productClient.
      inventoryClient:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - feign.FeignException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - feign.FeignException$NotFound

  # ===== Retry (L8 Phase 3) =====
  retry:
    instances:
      productClient:
        # 3 total attempts (first + 2 retries). Higher counts trigger retry
        # storm during partial outages — each extra attempt multiplies
        # downstream load on the already-struggling service.
        max-attempts: 3
        # Initial wait before first retry. Exponential growth from here.
        wait-duration: 500ms
        # 500ms → 1s → 2s growth — exponential gives downstream room to recover.
        exponential-backoff-multiplier: 2
        # ±30% jitter spread retries across a window — without jitter, every
        # client retries at the same instant and creates a thundering herd.
        # AWS-style "full jitter" alternative would set this to 1.0.
        randomized-wait-factor: 0.3
        # Only retry transient failures. 5xx and network errors can plausibly
        # resolve on retry; semantic errors (4xx) and CB OPEN cannot.
        retry-exceptions:
          - feign.FeignException$InternalServerError
          - feign.FeignException$BadGateway
          - feign.FeignException$ServiceUnavailable
          - feign.FeignException$GatewayTimeout
          - feign.RetryableException
          - java.net.SocketTimeoutException
          - java.io.IOException
        # NEVER retry these — pure waste of time.
        ignore-exceptions:
          - feign.FeignException$NotFound
          - feign.FeignException$BadRequest
          - feign.FeignException$Unauthorized
          - feign.FeignException$Forbidden
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      # L9 warm-up — same retry policy as productClient.
      inventoryClient:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2
        randomized-wait-factor: 0.3
        retry-exceptions:
          - feign.FeignException$InternalServerError
          - feign.FeignException$BadGateway
          - feign.FeignException$ServiceUnavailable
          - feign.FeignException$GatewayTimeout
          - feign.RetryableException
          - java.net.SocketTimeoutException
          - java.io.IOException
        ignore-exceptions:
          - feign.FeignException$NotFound
          - feign.FeignException$BadRequest
          - feign.FeignException$Unauthorized
          - feign.FeignException$Forbidden
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException

# Aspect order — CRITICAL: swap to avoid the @Retry-outside-@CB trap.
# Default order: Retry(CB(call)) means each retry attempt records to CB.
# We want: CB(Retry(call)) — 1 user request = 1 CB record regardless of retry count.
# Lower number = higher priority = OUTER aspect.
resilience4j.circuitbreaker.circuit-breaker-aspect-order: 1
resilience4j.retry.retry-aspect-order: 2

# ===== Actuator =====
# Expose health + metrics + circuitbreakers endpoints for chaos test verification.
management:
  endpoints:
    web:
      exposure:
        include: health, metrics, circuitbreakers, circuitbreakerevents
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
