# Cart service infra — MySQL on 3310, Adminer on 8093
#
# Usage:
#   docker compose up -d
#   docker compose ps
#   docker compose down       # 保留 data
#   docker compose down -v    # 連 volume 一齊刪

services:
  mysql:
    image: mysql:8.4
    container_name: cart-service-mysql
    restart: unless-stopped
    ports:
      - "3310:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-cart_service}
      MYSQL_USER:          ${MYSQL_USER:-cart_service}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD:-cart_service_pw}
      TZ: UTC
    volumes:
      - cart_service_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpw}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  adminer:
    image: adminer:5
    container_name: cart-service-adminer
    restart: unless-stopped
    ports:
      - "8093:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: dracula
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  cart_service_mysql_data:
    name: cart_service_mysql_data
